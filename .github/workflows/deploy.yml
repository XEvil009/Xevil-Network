
name: Validate X-Evil Network site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website entry point
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check homepage
        run: |
          test -s index.html || {
            echo "::error::Root index.html is missing or empty."
            exit 1
          }
          echo "Homepage exists and is not empty."
