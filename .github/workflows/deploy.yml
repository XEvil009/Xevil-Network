
name: Validate X-Evil Network site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website entry point
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check homepage
        shell: bash
        run: |
          set -euo pipefail

          test -s index.html || {
            echo "::error::Root index.html is missing or empty."
            exit 1
          }

          echo "Homepage exists and is not empty."
